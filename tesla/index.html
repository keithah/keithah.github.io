<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tesla Apps</title>
<!--
  Hub for keithah.github.io/tesla. Each app is its own repo, deployed by CI
  into a sibling folder: tesla-plex → plex/, tesla-channels → channels/,
  tesla-youtube → youtube/. Add a card below when a new app goes live.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #0b0b0d; color: #f2f2f2;
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 40px clamp(16px, 4vw, 56px);
  }
  h1 { font-size: 34px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.02em; }
  p.sub { color: #9a9aa2; margin: 0 0 32px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
  a.card, div.card {
    display: flex; flex-direction: column; justify-content: space-between; gap: 18px;
    min-height: 190px; padding: 26px; border-radius: 22px; text-decoration: none; color: inherit;
    background: #17171b; border: 1px solid #26262c;
  }
  a.card:active { transform: scale(0.98); }
  .icon { width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center; font-size: 30px; font-weight: 800; }
  .name { font-size: 26px; font-weight: 700; }
  .desc { color: #9a9aa2; font-size: 15px; margin-top: 4px; }
  .soon { opacity: 0.45; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; background: #26262c; color: #b5b5bd; }
  footer { margin-top: 36px; color: #5d5d66; font-size: 13px; }
  footer a { color: #8a8a94; }
</style>
</head>
<body>
  <h1>Tesla Apps</h1>
  <p class="sub">Video that keeps playing in Drive.</p>
  <div class="grid">
    <a class="card" href="plex/">
      <div class="icon" style="background:#e5a00d;color:#1f1f1f">▶</div>
      <div><div class="name">Plex</div><div class="desc">Your libraries · direct play</div></div>
    </a>
    <div class="card soon">
      <div class="icon" style="background:#3b82f6">C</div>
      <div><div class="name">Channels</div><div class="desc">Channels DVR <span class="tag">soon</span></div></div>
    </div>
    <div class="card soon">
      <div class="icon" style="background:#ef4444">▶</div>
      <div><div class="name">YouTube</div><div class="desc">Videos &amp; subscriptions <span class="tag">soon</span></div></div>
    </div>
  </div>
  <footer>Dev build: <a href="/cyberdash-clone/">keithah.github.io/cyberdash-clone</a></footer>
</body>
</html>
